{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h4">Identify your waste</h2>
        <p class="text-muted">Upload a clear photo of one waste item to get its category and disposal advice.</p>
        <form action="{{ url_for('predict_route') }}" method="post" enctype="multipart/form-data">
          <input class="form-control mb-3" type="file" name="image" id="image"
                 accept="image/png, image/jpeg" required>
          <img id="preview" class="img-fluid rounded mb-3 d-none" alt="Preview">
          <button class="btn btn-success w-100" type="submit">Classify</button>
        </form>
        <small class="text-muted d-block mt-3">Tip: one item, good light, plain background.</small>
      </div>
    </div>
  </div>
</div>
<script>
  document.getElementById("image").addEventListener("change", e => {
    const f = e.target.files[0];
    const p = document.getElementById("preview");
    if (f) { p.src = URL.createObjectURL(f); p.classList.remove("d-none"); }
  });
</script>
{% endblock %}
