{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h4 mb-3">Admin login</h2>
        <form method="post">
          <input class="form-control mb-3" name="username" placeholder="Username" required autofocus>
          <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
          <button class="btn btn-success w-100" type="submit">Log in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
